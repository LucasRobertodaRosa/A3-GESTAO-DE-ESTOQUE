# Configuracao da analise estatica no SonarQube Cloud (SonarCloud).
# A analise roda pelo GitHub Actions (.github/workflows/backend-ci.yml).
# Confira no painel do SonarCloud se a organizacao e a chave abaixo
# sao as mesmas geradas ao importar o repositorio.
sonar.organization=lucasrobertodarosa
sonar.projectKey=LucasRobertodaRosa_A3-GESTAO-DE-ESTOQUE
sonar.projectName=A3 - Gestao de Estoque

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Relatorio gerado na CI por "python -m coverage xml"
sonar.python.coverage.reportPaths=coverage.xml

# Telas (HTML/CSS/JS) sao verificadas pelos testes da interface Flask,
# nao por testes unitarios com relatorio de cobertura proprio.
sonar.coverage.exclusions=src/static/**,src/templates/**
