{% extends "base.html" %}
{% block titulo %}Primeiro acesso — Estoque{% endblock %}
{% block conteudo %}
<h1>Criar o administrador</h1>
<p class="dica">Ainda não há funcionários cadastrados. Esta conta terá acesso a tudo.</p>
<form method="post" class="formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label><span class="rotulo">Nome</span>
    <input name="nome" value="{{ valores.nome }}" autocomplete="name" required>
  </label>
  <label><span class="rotulo">Login</span>
    <input name="login" value="{{ valores.login }}" autocomplete="username" required>
  </label>
  <label><span class="rotulo">Senha <small>mínimo de 6 caracteres</small></span>
    <input name="senha" type="password" autocomplete="new-password" required minlength="6">
  </label>
  <label><span class="rotulo">Confirme a senha</span>
    <input name="confirmacao" type="password" autocomplete="new-password" required minlength="6">
  </label>
  <button class="botao" type="submit">Criar administrador</button>
</form>
{% endblock %}
